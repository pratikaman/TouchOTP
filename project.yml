name: TouchOTP
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  TouchOTPCore:
    type: library.static
    platform: macOS
    sources: [Sources/TouchOTPCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.touchotp.core
        SKIP_INSTALL: YES
  TouchOTP:
    type: application
    platform: macOS
    sources: [Sources/TouchOTP]
    dependencies:
      - target: TouchOTPCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.touchotp.mac
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/TouchOTP.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Y5VKS8JJ5
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  TouchOTP:
    build:
      targets:
        TouchOTP: all
    run:
      config: Debug
    archive:
      config: Release
